# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = Alt_L # Sets "Left ALT" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod       , Return, exec, $terminal
#bind = $mainMod SHIFT , Q, killactive
bind = $mainMod SHIFT , Q, exec, sh ~/.config/hypr/scripts/KillActiveWindow.sh
bind = $mainMod SHIFT , T, exec, sh ~/.last_closed
bind = $mainMod SHIFT , M, exit
bind = $mainMod       , E, exec, $fileManager
bind = $mainMod SHIFT , F, fullscreen, 0
#bind = $mainMod       , V, togglefloating
#bind = $mainMod       , V, centerwindow
bind = $mainMod       , V, exec, hyprctl --batch "dispatch togglefloating ; dispatch resizeactive -3 -22; dispatch centerwindow 1;  "
bind = $mainMod       , D, exec, $menu
bind = $mainMod       , P, pseudo, # dwindle
bind = $mainMod       , J, togglesplit, # dwindle

# Screenshot a window
bind = $mainMod      , PRINT, exec, hyprshot -m window -m active
# Screenshot a monitor
bind =               , PRINT, exec, hyprshot -m output -m active
# Screenshot a region
bind = $mainMod SHIFT, S    , exec, hyprshot -m region

# Move focus with mainMod + arrow keys
bind = $mainMod, left , movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up   , movefocus, u
bind = $mainMod, down , movefocus, d

bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,

bind = $mainMod SHIFT, left , movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up   , movewindow, u
bind = $mainMod SHIFT, down , movewindow, d

# Switch workspaces with mainMod + [1-9] 
# Also swaping workspaces if open on another monitor (like LeftWM)
# Before focusworkspaceoncurrentmonitor was using the following script:
# bind = $mainMod, 1, exec, ~/.config/hypr/scripts/workspace 1
# bind = $mainMod, 2, exec, ~/.config/hypr/scripts/workspace 2
bind = $mainMod, 1, focusworkspaceoncurrentmonitor, 1
bind = $mainMod, 2, focusworkspaceoncurrentmonitor, 2
bind = $mainMod, 3, focusworkspaceoncurrentmonitor, 3
bind = $mainMod, 4, focusworkspaceoncurrentmonitor, 4
bind = $mainMod, 5, focusworkspaceoncurrentmonitor, 5
bind = $mainMod, 6, focusworkspaceoncurrentmonitor, 6
bind = $mainMod, 7, focusworkspaceoncurrentmonitor, 7
bind = $mainMod, 8, focusworkspaceoncurrentmonitor, 8
bind = $mainMod, 9, focusworkspaceoncurrentmonitor, 9

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod      , W, togglespecialworkspace, magic
bind = $mainMod SHIFT, W, movetoworkspace       , special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, focusworkspaceoncurrentmonitor, e-1
bind = $mainMod, mouse_up, focusworkspaceoncurrentmonitor, e+1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
# Enable smart_split when positioning a window with the mouse
bind  = $mainMod, mouse:272, exec, hyprctl keyword dwindle:smart_split 1
bindr = $mainMod, mouse:272, exec, hyprctl keyword dwindle:smart_split 0

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume , exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume , exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute        , exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute     , exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp  , exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = ,XF86AudioNext , exec, playerctl next
bindl = ,XF86AudioPause, exec, playerctl play-pause
bindl = ,XF86AudioPlay , exec, playerctl play-pause
bindl = ,XF86AudioPrev , exec, playerctl previous
