# See https://wiki.hyprland.org/Configuring/Keywords/
$terminal    = kitty
$fileManager = dolphin
$menu        = pkill rofi || true && rofi -show drun -theme ~/.config/rofi/launcher/launcher.rasi 

# Default Search Engine for ROFI Search (SUPER S)
$Search_Engine = "https://www.google.com/search?q={}"

# Scripts programs
#$clipboard = ~/.config/rofi/clipboard/launcher.sh
