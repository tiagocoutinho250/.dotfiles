#$wallselect = ~/.config/rofi/wallselect/script.sh
#$wifi = ~/.config/rofi/wifi/wifi.sh
#$launcher = ~/.config/rofi/launcher/laucher.sh

# Apps
#$browser = firefox
$audio = pavucontrol
$lock = hyprlock
